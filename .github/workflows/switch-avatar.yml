name: Bili Avatar Auto-Switch

# ── 为什么是"每 30 分钟巡检"，而不是只定两个闹钟 ──────────────────────
# GitHub Actions 的 schedule 并不准点，实测本仓库的定时事件延迟 3~13 小时
# （免费账号高峰期排队）。所以不再押宝"08:35 / 17:30 各跑一次"，改成：
#   · 每 30 分钟巡检一次，按【北京时间】判断当前该显示哪张图；
#   · 读 nav 接口拿当前头像 URL（B站头像 URL 是图片内容哈希，同图恒定）；
#   · 只有"当前头像 != 目标图"时才上传，其余时候零操作退出。
# 效果：无论 GitHub 延迟多久，切换误差 <= 30 分钟；稳定态每天只上传 2 次。
#
# cron 用 UTC，北京时间 = UTC + 8

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分钟巡检（覆盖全天，抗 GitHub 延迟）
    - cron: "30 6 * * *"     # UTC 06:30 = 北京 14:30，每日体检 cookie
  workflow_dispatch:
    inputs:
      mode:
        description: "手动触发模式"
        type: choice
        options: [auto, force, check]
        default: auto

concurrency:
  group: bili-avatar
  cancel-in-progress: false

jobs:
  switch:
    name: Switch / Check
    runs-on: ubuntu-latest
    # cookie 失效时只有 14:30 的 check 会跑红 → GitHub 自动发邮件给仓库 owner。
    # 收到邮件后在本机跑 `python login.py relogin` 扫码，把新 cookie 粘回 Secrets。
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run orchestration
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "30 6 * * *" ] || [ "$MODE" = "check" ]; then
            echo "== check 模式：体检 cookie =="
            python3 run.py check
          elif [ "$MODE" = "force" ]; then
            echo "== force 模式：强制按当前时段上传 =="
            python3 run.py force
          else
            echo "== auto 模式：按需切换 =="
            python3 run.py auto
          fi
