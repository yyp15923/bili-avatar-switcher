name: Bili Avatar Auto-Switch

# GitHub Actions (UTC) → 北京时间 +8 小时
# 08:35 早  -> UTC 00:35  切 day
# 17:30 晚  -> UTC 09:30  切 night
# 14:30 体检 -> UTC 06:30  只体检 cookie，失效则推二维码扫码续期（不改头像）

on:
  schedule:
    - cron: "35 0 * * *"   # 08:35 早 - day
    - cron: "30 9 * * *"   # 17:30 晚 - night
    - cron: "30 6 * * *"   # 14:30 体检
  workflow_dispatch:
    inputs:
      mode:
        description: "手动触发模式: auto(按时间) / day / night / check(只体检)"
        type: choice
        options: [auto, day, night, check]
        default: auto

jobs:
  switch:
    name: Switch / Check
    runs-on: ubuntu-latest
    # 写回 secret 不在此 workflow 内做（GitHub 禁止用 Actions token 写 secret）
    # 新 cookie 会推送到企业微信，手动粘贴到 Secrets 一次即可
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -q requests "qrcode[pil]"

      - name: Run orchestration
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # 提供 GITHUB_TOKEN 供 run.py 尝试写回 secret (GitHub 禁止时会失败→自动降级为企业微信推送)
          export GITHUB_TOKEN="${{ github.token }}"
          case "${{ github.event_name }}" in
            schedule)
              if [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
                python run.py check
              else
                python run.py switch auto
              fi
              ;;
            workflow_dispatch)
              MODE="${{ github.event.inputs.mode }}"
              case "$MODE" in
                check)   python run.py check ;;
                auto|day|night) python run.py switch "$MODE" ;;
                *) echo "未知 mode: $MODE"; exit 1 ;;
              esac
              ;;
          esac
